<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Redirecting… — EMC Airline Cargo Suite</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Legacy redirect shim: /module.html?m=<id> now lives at clean static paths.
       Resolves old ids and aliases, then location.replace() to the real page. -->
  <script>
    (function () {
      var PATHS = {
        commercial:    "/modules/commercial",
        capacity:      "/modules/capacity-network",
        booking:       "/modules/booking",
        awb:           "/modules/shipment-awb",
        terminal:      "/modules/terminal-operations",
        uld:           "/modules/uld",
        revenue:       "/modules/revenue-accounting",
        compliance:    "/modules/compliance-security",
        collaboration: "/modules/stakeholder-collaboration",
        platform:      "/platform"
      };
      var ALIASES = {
        inquiry: "commercial", rates: "commercial",
        acceptance: "terminal", manifest: "terminal", operations: "terminal",
        tracking: "awb", shipment: "awb",
        cargoimp: "platform", broadcasting: "platform"
      };
      var key = (new URLSearchParams(window.location.search).get("m") || "commercial").toLowerCase();
      if (ALIASES[key]) key = ALIASES[key];
      if (!PATHS[key]) key = "commercial";
      window.location.replace(PATHS[key]);
    })();
  </script>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:40px;text-align:center">
    Redirecting to the EMC Airline Cargo Suite…
    <br><a href="/">Return to the platform overview</a>
  </p>
</body>
</html>
